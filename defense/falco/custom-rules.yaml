# KOAD Falco Custom Rules
# 35+ rules covering all ATT&CK Containers scenarios

# TA0001 — Initial Access

- rule: KOAD S01 SSRF Outbound Request to Metadata
  desc: Detect SSRF attempts to cloud metadata endpoints
  condition: >
    evt.type in (connect) and
    fd.sip in ("169.254.169.254", "metadata.google.internal") and
    container.id != host
  output: >
    SSRF to metadata API detected
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     dest=%fd.sip:%fd.sport command=%proc.cmdline)
  priority: CRITICAL
  tags: [KOAD, T1190, initial-access]

- rule: KOAD S02 Kubelet API Access
  desc: Detect direct access to kubelet API
  condition: >
    evt.type in (connect) and
    fd.sport in (10250, 10255) and
    container.id != host
  output: >
    Direct kubelet API access detected
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     dest=%fd.sip:%fd.sport command=%proc.cmdline)
  priority: WARNING
  tags: [KOAD, T1133, initial-access]

# TA0002 — Execution

- rule: KOAD S04 Shell in Container
  desc: Detect shell spawned in a container
  condition: >
    spawned_process and
    container and
    proc.name in (bash, sh, ash, zsh, dash, ksh) and
    not proc.pname in (bash, sh, ash, zsh, dash, ksh, runc, containerd-shim)
  output: >
    Shell spawned in container
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     user=%user.name command=%proc.cmdline parent=%proc.pname)
  priority: WARNING
  tags: [KOAD, T1059, execution]

- rule: KOAD S05 kubectl Execution in Container
  desc: Detect kubectl usage inside a container
  condition: >
    spawned_process and
    container and
    proc.name = kubectl
  output: >
    kubectl executed inside container
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     command=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags: [KOAD, T1609, execution]

- rule: KOAD S07 CronJob Created
  desc: Detect suspicious CronJob creation via audit
  condition: >
    jevt.value[/verb] = "create" and
    jevt.value[/objectRef/resource] = "cronjobs"
  output: >
    CronJob created
    (user=%jevt.value[/user/username] ns=%jevt.value[/objectRef/namespace]
     name=%jevt.value[/objectRef/name])
  priority: WARNING
  source: k8s_audit
  tags: [KOAD, T1053, execution]

# TA0003 — Persistence

- rule: KOAD S09 ClusterRoleBinding Created
  desc: Detect creation of ClusterRoleBinding
  condition: >
    jevt.value[/verb] = "create" and
    jevt.value[/objectRef/resource] = "clusterrolebindings"
  output: >
    ClusterRoleBinding created
    (user=%jevt.value[/user/username] name=%jevt.value[/objectRef/name])
  priority: CRITICAL
  source: k8s_audit
  tags: [KOAD, T1098, persistence]

- rule: KOAD S10 ServiceAccount in kube-system
  desc: Detect new ServiceAccount creation in kube-system
  condition: >
    jevt.value[/verb] = "create" and
    jevt.value[/objectRef/resource] = "serviceaccounts" and
    jevt.value[/objectRef/namespace] = "kube-system"
  output: >
    ServiceAccount created in kube-system
    (user=%jevt.value[/user/username] name=%jevt.value[/objectRef/name])
  priority: CRITICAL
  source: k8s_audit
  tags: [KOAD, T1136, persistence]

- rule: KOAD S11 Sidecar Container Detected
  desc: Detect pods with unexpected sidecar containers
  condition: >
    spawned_process and
    container and
    k8s.pod.name != "" and
    proc.name in (sh, bash, curl, wget) and
    container.name contains "agent"
  output: >
    Suspicious sidecar container activity
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     command=%proc.cmdline)
  priority: WARNING
  tags: [KOAD, T1543, persistence]

# TA0004 — Privilege Escalation

- rule: KOAD S13 Privileged Container Started
  desc: Detect privileged container execution
  condition: >
    container and
    container.privileged = true and
    evt.type = execve
  output: >
    Process in privileged container
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     command=%proc.cmdline image=%container.image.repository)
  priority: CRITICAL
  tags: [KOAD, T1611, privilege-escalation]

- rule: KOAD S14 Cgroup Manipulation
  desc: Detect cgroup escape via release_agent
  condition: >
    open_write and
    container and
    (fd.name contains "release_agent" or fd.name contains "notify_on_release")
  output: >
    Cgroup release_agent manipulation detected
    (container=%container.name pod=%k8s.pod.name
     file=%fd.name command=%proc.cmdline)
  priority: CRITICAL
  tags: [KOAD, T1611, privilege-escalation]

- rule: KOAD S15 Docker Socket Access
  desc: Detect access to Docker socket from container
  condition: >
    evt.type in (open, connect) and
    container and
    fd.name = "/var/run/docker.sock"
  output: >
    Docker socket access from container
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     command=%proc.cmdline)
  priority: CRITICAL
  tags: [KOAD, T1611, privilege-escalation]

- rule: KOAD S16 Core Pattern Modified
  desc: Detect modification of core_pattern for escape
  condition: >
    open_write and
    fd.name = "/proc/sys/kernel/core_pattern" and
    container
  output: >
    core_pattern modified from container
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline)
  priority: CRITICAL
  tags: [KOAD, T1611, privilege-escalation]

- rule: KOAD S17 Ptrace in Container
  desc: Detect ptrace usage inside container
  condition: >
    evt.type = ptrace and
    container
  output: >
    ptrace detected in container
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline target=%evt.arg.addr)
  priority: CRITICAL
  tags: [KOAD, T1611, privilege-escalation]

- rule: KOAD S18 Device Node Created
  desc: Detect mknod in container (lxcfs escape)
  condition: >
    evt.type = mknod and
    container
  output: >
    Device node created in container
    (container=%container.name pod=%k8s.pod.name
     file=%evt.arg.path command=%proc.cmdline)
  priority: CRITICAL
  tags: [KOAD, T1611, privilege-escalation]

- rule: KOAD S19 Kernel Exploit Attempt
  desc: Detect known kernel exploit binaries
  condition: >
    spawned_process and
    container and
    proc.name in (dirty_pipe, exploit, dirtypipe, cve_exploit)
  output: >
    Potential kernel exploit execution
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags: [KOAD, T1068, privilege-escalation]

# TA0005 — Stealth

- rule: KOAD S20 Docker Build in Container
  desc: Detect docker build executed from inside a container
  condition: >
    spawned_process and
    container and
    proc.name = docker and
    proc.cmdline contains "build"
  output: >
    Docker build from container
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline)
  priority: CRITICAL
  tags: [KOAD, T1612, stealth]

- rule: KOAD S21 History File Deletion
  desc: Detect deletion of shell history files
  condition: >
    (evt.type in (unlink, unlinkat) or open_write) and
    container and
    (fd.name contains ".bash_history" or fd.name contains ".ash_history")
  output: >
    History file tampered
    (container=%container.name pod=%k8s.pod.name
     file=%fd.name command=%proc.cmdline)
  priority: WARNING
  tags: [KOAD, T1070, stealth]

- rule: KOAD S22 Pod in kube-system Without System Label
  desc: Detect non-system pods in kube-system namespace
  condition: >
    jevt.value[/verb] = "create" and
    jevt.value[/objectRef/resource] = "pods" and
    jevt.value[/objectRef/namespace] = "kube-system" and
    not jevt.value[/user/username] startswith "system:"
  output: >
    Non-system pod created in kube-system
    (user=%jevt.value[/user/username] name=%jevt.value[/objectRef/name])
  priority: CRITICAL
  source: k8s_audit
  tags: [KOAD, T1036, stealth]

# TA0112 — Defense Impairment

- rule: KOAD S23 Security Tool Deletion
  desc: Detect deletion of security-related DaemonSets or Deployments
  condition: >
    jevt.value[/verb] = "delete" and
    jevt.value[/objectRef/resource] in ("daemonsets", "deployments") and
    jevt.value[/objectRef/namespace] in ("falco", "kyverno", "gatekeeper-system")
  output: >
    Security tool deletion detected
    (user=%jevt.value[/user/username] resource=%jevt.value[/objectRef/resource]
     name=%jevt.value[/objectRef/name] ns=%jevt.value[/objectRef/namespace])
  priority: CRITICAL
  source: k8s_audit
  tags: [KOAD, T1685, defense-impairment]

# TA0006 — Credential Access

- rule: KOAD S24 Brute Force Attempt
  desc: Detect password spraying tools
  condition: >
    spawned_process and
    container and
    proc.name in (hydra, medusa, ncrack, patator)
  output: >
    Brute force tool detected
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline)
  priority: CRITICAL
  tags: [KOAD, T1110, credential-access]

- rule: KOAD S25 Environment Variable Dump
  desc: Detect reading of environment variables (credential theft)
  condition: >
    spawned_process and
    container and
    (proc.cmdline contains "/proc/*/environ" or
     (proc.name = env and proc.args = ""))
  output: >
    Environment dump detected
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline)
  priority: WARNING
  tags: [KOAD, T1528, credential-access]

- rule: KOAD S26 SA Token Read
  desc: Detect reading of ServiceAccount token files
  condition: >
    open_read and
    container and
    fd.name = "/var/run/secrets/kubernetes.io/serviceaccount/token" and
    not proc.name in (kubelet, kube-proxy)
  output: >
    SA token read
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline user=%user.name)
  priority: WARNING
  tags: [KOAD, T1552, credential-access]

# TA0007 — Discovery

- rule: KOAD S28 Network Scanning
  desc: Detect nmap or similar network scanning tools
  condition: >
    spawned_process and
    container and
    proc.name in (nmap, masscan, zmap, naabu)
  output: >
    Network scan tool detected
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline)
  priority: WARNING
  tags: [KOAD, T1046, discovery]

# TA0008 — Lateral Movement

- rule: KOAD S30 Cross-Namespace Secret Access
  desc: Detect access to secrets in different namespaces
  condition: >
    jevt.value[/verb] = "get" and
    jevt.value[/objectRef/resource] = "secrets" and
    jevt.value[/objectRef/namespace] != jevt.value[/user/extra/authentication.kubernetes.io~1pod-namespace/0]
  output: >
    Cross-namespace secret access
    (user=%jevt.value[/user/username]
     target_ns=%jevt.value[/objectRef/namespace]
     secret=%jevt.value[/objectRef/name])
  priority: CRITICAL
  source: k8s_audit
  tags: [KOAD, T1550, lateral-movement]

# TA0040 — Impact

- rule: KOAD S32 Resource Intensive Container
  desc: Detect containers requesting excessive resources
  condition: >
    spawned_process and
    container and
    (proc.cmdline contains "stress" or proc.cmdline contains "stress-ng" or
     proc.name in (stress, stress-ng, cpuburn))
  output: >
    Resource-intensive process detected
    (container=%container.name pod=%k8s.pod.name
     command=%proc.cmdline)
  priority: WARNING
  tags: [KOAD, T1499, impact]

- rule: KOAD S35 Cryptominer Process
  desc: Detect known cryptominer processes
  condition: >
    spawned_process and
    container and
    (proc.name in (xmrig, minerd, minergate, cpuminer) or
     proc.cmdline contains "stratum+" or
     proc.cmdline contains "pool.minergate" or
     proc.cmdline contains "xmrpool")
  output: >
    Cryptominer detected
    (container=%container.name pod=%k8s.pod.name ns=%k8s.ns.name
     command=%proc.cmdline image=%container.image.repository)
  priority: CRITICAL
  tags: [KOAD, T1496, impact]
