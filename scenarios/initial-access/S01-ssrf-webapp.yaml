# KOAD-S01: SSRF Vulnerable Web App
# ATT&CK: T1190 — Exploit Public-Facing Application
# Attack: Flask App with SSRF → Metadata API → Cloud IAM credentials
---
apiVersion: v1
kind: Namespace
metadata:
  name: koad
  labels:
    koad/scenario: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssrf-webapp
  namespace: koad
  labels:
    app: ssrf-webapp
    koad-scenario: S01
    mitre-attck: T1190
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssrf-webapp
  template:
    metadata:
      labels:
        app: ssrf-webapp
        koad-scenario: S01
    spec:
      containers:
        - name: webapp
          image: koad/vulnerable-webapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "development"
---
apiVersion: v1
kind: Service
metadata:
  name: ssrf-webapp
  namespace: koad
  labels:
    koad-scenario: S01
spec:
  type: NodePort
  selector:
    app: ssrf-webapp
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
---
# Mock Metadata API (simulates cloud metadata endpoint)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-metadata
  namespace: koad
  labels:
    app: mock-metadata
    koad-scenario: S01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-metadata
  template:
    metadata:
      labels:
        app: mock-metadata
    spec:
      containers:
        - name: metadata
          image: koad/mock-metadata:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mock-metadata
  namespace: koad
spec:
  selector:
    app: mock-metadata
  ports:
    - port: 80
      targetPort: 8080
