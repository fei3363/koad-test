# KOAD-S03: Leaked kubeconfig
# ATT&CK: T1078 — Valid Accounts
# Attack: ConfigMap contains admin kubeconfig in plaintext
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: koad
  labels:
    koad-scenario: S03
    mitre-attck: T1078
  annotations:
    description: "Intentionally vulnerable — contains leaked kubeconfig"
data:
  app.conf: |
    [database]
    host = db.koad.svc.cluster.local
    port = 5432
    name = myapp
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        server: https://kubernetes.default.svc
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      name: in-cluster
    contexts:
    - context:
        cluster: in-cluster
        user: admin
      name: admin-context
    current-context: admin-context
    users:
    - name: admin
      user:
        token: LEAKED_ADMIN_TOKEN_PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: leaked-config-app
  namespace: koad
  labels:
    app: leaked-config-app
    koad-scenario: S03
spec:
  replicas: 1
  selector:
    matchLabels:
      app: leaked-config-app
  template:
    metadata:
      labels:
        app: leaked-config-app
        koad-scenario: S03
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: config
              mountPath: /etc/app-config
      volumes:
        - name: config
          configMap:
            name: app-config
