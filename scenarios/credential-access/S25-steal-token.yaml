# KOAD-S25: Steal Application Access Token
# ATT&CK: T1528 — Steal Application Access Token
# Attack: Steal OAuth/API tokens from env vars and ConfigMaps
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-secrets-exposed
  namespace: koad
  labels:
    koad-scenario: S25
    mitre-attck: T1528
data:
  config.yaml: |
    github:
      token: ghp_FAKE_TOKEN_FOR_DEMO_PURPOSES_ONLY_1234567890
    slack:
      webhook: https://hooks.example.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX
    aws:
      access_key: AKIAIOSFODNN7EXAMPLE
      secret_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-leak-app
  namespace: koad
  labels:
    app: token-leak-app
    koad-scenario: S25
spec:
  replicas: 1
  selector:
    matchLabels:
      app: token-leak-app
  template:
    metadata:
      labels:
        app: token-leak-app
        koad-scenario: S25
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          env:
            - name: API_KEY
              value: "sk-FAKE-API-KEY-FOR-DEMO-12345"
            - name: DATABASE_URL
              value: "postgresql://admin:P@ssw0rd@db:5432/myapp"
            - name: JWT_SECRET
              value: "super-secret-jwt-key-do-not-share"
          volumeMounts:
            - name: config
              mountPath: /etc/app-config
      volumes:
        - name: config
          configMap:
            name: app-secrets-exposed
