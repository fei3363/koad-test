---
apiVersion: v1
kind: Namespace
metadata:
  name: koad-production
  labels:
    koad-scenario: S30
---
apiVersion: v1
kind: Secret
metadata:
  name: production-db-creds
  namespace: koad-production
  labels:
    koad-scenario: S30
type: Opaque
data:
  host: cHJvZC1kYi5leGFtcGxlLmNvbQ==
  username: cHJvZF9hZG1pbg==
  password: UHIwZF9TdXBlclNlY3JldCE=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-app
  namespace: koad-production
  labels:
    app: production-app
    koad-scenario: S30
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production-app
  template:
    metadata:
      labels:
        app: production-app
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
