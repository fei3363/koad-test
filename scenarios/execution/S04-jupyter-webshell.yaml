# KOAD-S04: Unauthenticated Jupyter Notebook
# ATT&CK: T1059 — Command and Scripting Interpreter
# Attack: Jupyter Notebook without auth → shell access
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-insecure
  namespace: koad
  labels:
    app: jupyter-insecure
    koad-scenario: S04
    mitre-attck: T1059
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-insecure
  template:
    metadata:
      labels:
        app: jupyter-insecure
        koad-scenario: S04
    spec:
      containers:
        - name: jupyter
          image: jupyter/base-notebook:latest
          imagePullPolicy: IfNotPresent
          args: ["start-notebook.sh", "--NotebookApp.token=''", "--NotebookApp.password=''"]
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter-insecure
  namespace: koad
  labels:
    koad-scenario: S04
spec:
  type: NodePort
  selector:
    app: jupyter-insecure
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30088
