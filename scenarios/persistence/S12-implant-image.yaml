# KOAD-S12: Implant Internal Image
# ATT&CK: T1525 — Implant Internal Image
# Attack: Push backdoored image to private registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-registry
  namespace: koad-registry
  labels:
    app: private-registry
    koad-scenario: S12
    mitre-attck: T1525
spec:
  replicas: 1
  selector:
    matchLabels:
      app: private-registry
  template:
    metadata:
      labels:
        app: private-registry
        koad-scenario: S12
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: private-registry
  namespace: koad-registry
  labels:
    koad-scenario: S12
spec:
  type: NodePort
  selector:
    app: private-registry
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
---
apiVersion: v1
kind: Pod
metadata:
  name: image-implanter
  namespace: koad
  labels:
    koad-scenario: S12
spec:
  containers:
    - name: implanter
      image: docker:24-cli
      command: ["sh", "-c"]
      args:
        - |
          echo "=== KOAD-S12: Implant Image ==="
          echo ""
          echo "Attack steps:"
          echo "  1. Pull legitimate image"
          echo "     docker pull nginx:1.27-alpine"
          echo ""
          echo "  2. Add backdoor layer"
          echo "     docker build -t private-registry.koad-registry:5000/nginx:1.27-alpine ."
          echo ""
          echo "  3. Push to private registry"
          echo "     docker push private-registry.koad-registry:5000/nginx:1.27-alpine"
          echo ""
          echo "  4. Victim pulls 'nginx' from internal registry — gets backdoor"
          sleep infinity
